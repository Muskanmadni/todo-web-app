apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: todo-app
  labels:
    app: todo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "todo-backend"
        dapr.io/app-port: "8000"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "debug"
    spec:
      imagePullSecrets:
      - name: acr-image-pull-secret
      containers:
      - name: todo-backend
        image: todoappregistry2026.azurecr.io/todo-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://neondb_owner:npg_ywfK5ROea2kh@ep-hidden-paper-adebc1e9-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
        - name: GEMINI_API_KEY
          value: "AIzaSyA5R-C3lTFzBTRomw8tu8rDoev7FFyL1rA"
        - name: SECRET_KEY
          value: "IOoF2Js0vpK6zYcbWtQng81DhRHMUdSk"
        - name: BETTER_AUTH_SECRET
          value: "your_better_auth_secret_here"
        - name: DAPR_SIDECAR_HOST
          value: "localhost"
        - name: DAPR_SIDECAR_PORT
          value: "3500"
        - name: DAPR_HTTP_ENDPOINT
          value: "http://localhost:3500"
        - name: DAPR_STATE_STORE_NAME
          value: "todo-statestore"
        - name: DAPR_PUBSUB_NAME
          value: "todo-pubsub"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: KAFKA_TASK_EVENTS_TOPIC
          value: "task-events"
        - name: KAFKA_REMINDERS_TOPIC
          value: "reminders"
        - name: KAFKA_TASK_UPDATES_TOPIC
          value: "task-updates"
        - name: REMINDER_CHECK_INTERVAL_MINUTES
          value: "5"
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  namespace: todo-app
spec:
  selector:
    app: todo-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP